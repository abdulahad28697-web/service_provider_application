# ServiceHub AI — local development stack.
#
#   docker compose up --build
#   http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: servicehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/servicehub
      REDIS_URL: redis://redis:6379/0
      ENABLE_REDIS: "true"
      SECRET_KEY: dev-secret-change-me
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Run the unit test suite in an isolated container. Tests use an in-memory
  # SQLite database, so no Postgres/Redis are required.
  #
  #   docker compose run --rm test
  test:
    build: ./backend
    command: pytest -v
    environment:
      DATABASE_URL: sqlite+aiosqlite://
      ENABLE_REDIS: "false"
      SECRET_KEY: test-secret
      CORS_ORIGINS: '["http://localhost:3000"]'

volumes:
  pgdata:
